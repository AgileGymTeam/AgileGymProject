<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>View Trainers</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
        <style>
            #trainerList {
                display: grid;
                grid-template-columns: repeat(3,1fr);
                gap: 10px;
                align-items: start;
            }
            .trainerView, h1 {
                background-color: #fff;
                border-top: 3px solid #3a60c7;
                border-bottom: 2px solid #e5e7eb;
                text-align: center;
                padding: 1px;
                margin: 5px;
            }
            h1 {
                padding: 15px;
                border: none;
                background-color: #e3e5ec;
                margin: 10px;
            }
            label {
                text-transform: uppercase;
                color: #5e5e5e;
                display: block;
                margin: 5px;
            }
            .trainerClasses, .trainerHours {
                display: grid;
                gap: 5px;
                color: #3a60c7;
                margin: 10px;
            }
        </style>
    </head>

    <body>
        <table class="navigation">
            <tr>
                <td class="navBox"><a href=""><strong>[Website name]</strong></a></td>
                <td class="navBox"><a href="staffTrainerView.html"><strong>Trainers</strong></a></td>
                <td class="navBox"><a href="staffClassView.html"><strong>Classes</strong></a></td>
                <td class="navBox"><a href=""><strong>Logout</strong></a></td>
            </tr>
        </table>

        <div class="container">
            <h1>Trainers</h1>
            <template id="trainerTemplate">
                <div class="trainerView">
                    <h2 class="trainerName"></h2>
                    <label>Assigned classes:</label>
                        <div class="trainerClasses"></div>
                    <label>Total hours:</label>
                        <p class="trainerHours"></p>
                </div>               
            </template>

            <div id="trainerList"></div>

        </div>

        <script type="module">
            import { db } from './firebaseConfig.js'
            import { ref, onValue } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-database.js";

            // DISPLAY ALL TRAINERS IN A LIST

            // set variables
            const list = document.getElementById('trainerList');
            const template = document.getElementById('trainerTemplate');
            const trainersRef = ref(db, 'trainers');
            const classesRef = ref(db, 'classes');

            let allClasses = {};
            let classesLoaded = false;

            function loadTrainers() {
                // create real time listener
                onValue(trainersRef, (snapshot) => {
                    // clear list before re-render
                    list.innerHTML = ''; 

                    // get data snapshot
                    const data = snapshot.val();

                    // in case data is null, return
                    if (!data) {
                        list.innerHTML = "<p>No trainers found</p>";
                        return;
                    }

                    // loop over each trainer
                    for (let key in data) {
                        const trainerData = data[key];
                        let totalHours = 0;

                        // make copy of template
                        const templateCopy = template.content.cloneNode(true);

                        // fill in template with trainer details
                        templateCopy.querySelector('.trainerName').textContent = trainerData.name;
                        
                        // add classes
                        const classesContainer = templateCopy.querySelector('.trainerClasses');
                        if (trainerData.classes) {
                            

                            Object.keys(trainerData.classes).forEach(classId => {

                                const classData = allClasses[classId];

                                if (!classData) return;

                                // add class hours 
                                totalHours += classData.time.hours;


                                // create tag element
                                const classTag = document.createElement('span');
                                classTag.textContent = classData.name;
                                classTag.classList.add('classTag');

                                // add to container
                                classesContainer.appendChild(classTag);
                            });
                        }

                        // add final total hours to template
                        templateCopy.querySelector('.trainerHours').textContent = totalHours;

                        // add to list
                        list.appendChild(templateCopy);
                    }
                });
            }

            // classes snapshot
            onValue(classesRef, (snapshot) => {
                allClasses = snapshot.val() || {};

                // ensure classes load before trainer snapshot
                classesLoaded = true;
                loadTrainers();
            });
        </script> 
    </body>
</html>
