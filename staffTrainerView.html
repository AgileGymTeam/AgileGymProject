<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>View Trainers</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
        <style>
            #trainerList {
                display: grid;
                grid-template-columns: repeat(3,1fr);
                gap: 10px;
                align-items: start;
            }
            .trainerView, h1 {
                background-color: #fff;
                border-top: 3px solid #3a60c7;
                border-bottom: 2px solid #e5e7eb;
                text-align: center;
                padding-bottom: 20px;
                margin: 5px;
            }
            h1 {
                padding: 15px;
                border: none;
                background-color: #e3e5ec;
                margin: 10px;
            }
            label {
                text-transform: uppercase;
                color: #5e5e5e;
                display: block;
                margin: 5px;
            }
            .trainerDetails {
                text-decoration: none;
                color: #374151;
                font-weight: 600;
                font-size: 20px;
                padding: 8px 12px;
                border-radius: 8px;
            }
            .trainerDetails:hover {
                background: #eef2ff;
                color: #263c7a;
            }
        </style>
    </head>

    <body>
        <table class="navigation">
            <tr>
                <td class="navBox"><a href="StaffDashboard.html"><strong>FitSync</strong></a></td>
                <td class="navBox"><a href="staffTrainerView.html"><strong>Trainers</strong></a></td>
                <td class="navBox"><a href="staffClassView.html"><strong>Classes</strong></a></td>
            </tr>
        </table>

        <div class="container">
            <h1>Trainers</h1>
            <template id="trainerTemplate">
                <div class="trainerView">
                    <h2 class="trainerName"></h2>
                    <a class="trainerDetails">Manage trainer</a>
                </div>               
            </template>

            <div id="trainerList"></div>

        </div>

        <script type="module">
            import { db, auth } from './firebaseConfig.js'
            import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-auth.js";
            import { ref, onValue } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-database.js";

            onAuthStateChanged(auth, async (user) => {
                if (!user) {
                    window.location.href = "index.html";
                    return;
                }

                // DISPLAY ALL TRAINERS IN A LIST

                // set variables
                const list = document.getElementById('trainerList');
                const template = document.getElementById('trainerTemplate');
                const usersRef = ref(db, 'users')

                // create real time listener
                onValue(usersRef, (snapshot) => {
                    // clear list before re-render
                    list.innerHTML = ''; 

                    // get data snapshot
                    const data = snapshot.val();

                    // in case data is null, return
                    if (!data) {
                        list.innerHTML = "<p>No trainers found</p>";
                        return;
                    }

                    // loop over each user, only use users with role: trainer
                    for (let key in data) {
                        if (data[key].role === 'trainer') {
                            const trainerData = data[key];

                            // make copy of template
                            const templateCopy = template.content.cloneNode(true);

                            // fill in template with class details
                            templateCopy.querySelector('.trainerName').textContent = trainerData.profile.firstName;
                            // pass trainer id as a parameter to next page
                            templateCopy.querySelector('.trainerDetails').href = `staffTrainerDetails.html?id=${key}`;

                            // add to list
                            list.appendChild(templateCopy);
                        };
                    }
                });
            });
        </script> 
    </body>
</html>
