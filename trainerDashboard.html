<!DOCTYPE html>
<html>

<head>
    <title>Trainer Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="dashboardPage">
        <div class="welcomeSection">
            <h1 id="welcomeMessage">Hello Trainer!</h1>
            <p>View your assigned gym classes.</p>
        </div>

        <div class="classesPreview">
            <h2>My Classes</h2>
            <p>View classes assigned to you.</p>
            <a href="trainerClassView.html">View My Classes</a>
            <a href="trainerDetails.html">View details</a>
        </div>

        <div class="logoutSection">
            <button id="logoutBtn">Logout</button>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebaseConfig.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-auth.js";
        import { ref, get } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-database.js";

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }

            const userRef = ref(db, "users/" + user.uid);
            const snapshot = await get(userRef);

            if (snapshot.exists()) {
                const userData = snapshot.val();

                if (userData.role !== "trainer") {
                    window.location.href = "index.html";
                    return;
                }

                const firstName = userData.profile?.firstName || "Trainer";
                document.getElementById("welcomeMessage").textContent = "Hello " + firstName + "!";
            }
        });

        document.getElementById("logoutBtn").addEventListener("click", async () => {
            await signOut(auth);
            window.location.href = "index.html";
        });
    </script>

</body>

</html>
