<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Class details</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
        <style>
            .sideLayout {
                display: flex;
                gap: 20px;
            }
            .content, h1 {
                background-color: #fff;
                border-bottom: 2px solid #e5e7eb;
                text-align: center;
                padding: 15px;
                margin: 5px;
            }
            h1 {
                padding: 15px;
                background-color: #e3e5ec;
                margin: 10px;
            }
            label {
                text-transform: uppercase;
                color: #5e5e5e;
                display: block;
                margin: 5px;
            }
            .classDetails {
                width: 30%;
            }
            .classForm{
                width: 70%;
                border-top: 3px solid #3a60c7;
            }
            #className, #classDate, #classTime, #classLength, #trainerName {
                color: #3a60c7;
                font-size: 18px;
                margin-top: 5px;
            }
            input, select { 
                width: 80%;
                height: 25px;
                margin-bottom: 10px;
            }
            select {
                width: 81%;
                height: 30px;
                border: none;
            }
            button {
                text-decoration: none;
                border: none;
                font-weight: 600;
                padding: 8px 12px;
                margin: 10px;
                border-radius: 8px;
            }
            button:hover {
                background: #eef2ff;
                color: #263c7a;
            }
            #deleteClassButton:hover {
                background: #ffeeee;
                color: #7a2626;                
            }

        </style>
    </head>
    <body>
        <table class="navigation">
            <tr>
                <td class="navBox"><a href="StaffDashboard.html"><strong>FitSync</strong></a></td>
                <td class="navBox"><a href="staffTrainerView.html"><strong>Trainers</strong></a></td>
                <td class="navBox"><a href="staffClassView.html"><strong>Classes</strong></a></td>
            </tr>
        </table>

        <div class="container">
            <h1>Manage class details</h1>
            <div class="sideLayout">
                <div class="content classDetails">
                    <h2>Current class details:</h2>
                    <label>Class name:</label>
                        <p id="className"></p>
                    <label>Date:</label>
                        <p id="classDate"></p>
                    <label>Time start:</label>
                        <p id="classTime"></p>
                    <label>Class length:</label>
                        <p id="classLength"></p>
                    <label>Assigned trainer:</label>
                        <p id="trainerName"></p>
                    <form id="deleteClass">
                        <button type='submit' id="deleteClassButton">Delete class</button>
                    </form>
                </div>

                <div class="content classForm">
                    <h2>Edit class details:</h2>
                    <form id="editClass">
                        <label>Class name:</label>
                            <input type="text" id="inputClassName">
                        <br>
                        <label>Date:</label>
                            <input type="date" id="inputDate">
                        <br>
                        <label>Time start:</label>
                            <input type="time" id="inputStartTime">
                        <br>
                        <label>Class length (hours):</label>
                            <input type="number" id="inputLength">
                        <br>
                        <label>Assign trainer:</label>
                            <select id="assignTrainer">
                                <option value="">Select a trainer</option>
                                <option value="unassign">Unassign trainer</option>
                            </select>
                        <br>
                        <button type="submit" id="updateButton">Apply changes</button>
                    </form>
                </div>
            </div>
        </div>

        <script type="module">
            import { db, auth } from './firebaseConfig.js'
            import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-auth.js";
            import { ref, onValue, update, set, remove } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-database.js";

            // AUTHORISATION

            onAuthStateChanged(auth, async (user) => {
                if (!user) {
                    window.location.href = "index.html";
                    return;
                }

                // catch params passed from class view page 
                const id = new URLSearchParams(window.location.search).get('id');
                const classRef = ref(db, `classes/${id}`);
                const usersRef = ref(db, 'users');

                const assign = document.getElementById('assignTrainer');

                let trainerCache = {};
                let classData = null;

                // DISPLAY CLASS DETAILS FROM DATABASE

                // create real time listener
                onValue(classRef, (classSnapshot) => {

                    // get class data snapshot
                    classData = classSnapshot.val();

                    // return function if no data
                    if (!classData) return;

                    // fill in class details from database
                    document.getElementById('className').textContent = classData.name;
                    document.getElementById('classDate').textContent = classData.date;
                    document.getElementById('classTime').textContent = classData.time.start;
                    if (classData.time.hours <= 1) {
                        document.getElementById('classLength').textContent = classData.time.hours + ' hour';
                    } else {
                        document.getElementById('classLength').textContent = classData.time.hours + ' hours';
                    };
                    
                    // render the trainers name
                    renderTrainerName(classData);
                });

                // DISPLAY ALL TRAINERS IN DROPDOWN 

                // create listener for all trainers
                onValue(usersRef, (userSnapshot) => {

                    // get snapshot of all trainers and add to trainers cache
                    trainerCache = userSnapshot.val();

                    // clear old trainer options but keep placeholder and unassign (avoids duplicates)
                    assign.querySelectorAll("option:not([value=''])").forEach(opt => {
                        if (opt.value !== 'unassign') opt.remove();
                    });

                    for (let key in trainerCache) {
                        const trainer = trainerCache[key];

                        if (trainer.role === 'trainer') {
                            const option = document.createElement('option');
                            option.value = key;
                            option.textContent = trainer.profile.firstName;
                            assign.appendChild(option);
                        }
                    }

                    // call render function again incase name updated
                    renderTrainerName();
                }) 

                // function to render the trainers name in details
                function renderTrainerName() {
                    if (!classData) return;

                    const name = trainerCache?.[classData.trainer_ID]?.profile?.firstName || 'No trainer assigned';
                    document.getElementById('trainerName').textContent = name;
                }

                // DELETE CLASS BUTTON

                // button event listener for when button is clicked
                const deleteButton = document.getElementById('deleteClass');
                deleteButton.addEventListener('submit', async (e) => {
                    e.preventDefault();

                    // delete class from database if user confirms
                    if (confirm('Class will be deleted from system. Continue?')) {
                        await remove(ref(db, `classes/${id}`));
                        window.location.replace('staffClassView.html');
                    }
                })

                // UPDATING DATABASE

                // add button event listener to update when button is clicked
                const form = document.getElementById('editClass');
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();

                    if (!classData) return;

                    const oldTrainerId = classData.trainer_ID;
                    const newTrainerId = assign.value;
        
                    // store only values that change in updatedData
                    const updatedData = {}

                    const name = document.getElementById('inputClassName').value;
                    if (name) updatedData.name = name;

                    const date = document.getElementById('inputDate').value;
                    if (date) updatedData.date = date;

                    const startTime = document.getElementById('inputStartTime').value;
                    if (startTime) updatedData['time/start'] = startTime;

                    const hours = document.getElementById('inputLength').value;
                    if (hours) updatedData['time/hours'] = Number(hours);

                    if (newTrainerId === 'unassign') {
                        updatedData.trainer_ID = null;
                    } else if (newTrainerId) {
                        updatedData.trainer_ID = newTrainerId;
                    }

                    /// determine final trainer value
                    const finalTrainerId =
                        newTrainerId === 'unassign'
                            ? null
                            : newTrainerId || null;

                    // update class
                    await update(classRef, {
                        ...updatedData,
                        trainer_ID: finalTrainerId
                    });

                    // remove old trainer link
                    if (oldTrainerId && oldTrainerId !== finalTrainerId) {
                        await remove(ref(db, `users/${oldTrainerId}/classes/${id}`));
                    }

                    // add new trainer link
                    if (finalTrainerId) {
                        await set(
                            ref(db, `users/${finalTrainerId}/classes/${id}`),
                            true
                        );
                    }
                });
            });
        </script>
    </body>
</html>
