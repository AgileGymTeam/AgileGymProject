<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Class details</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
        <style>
            .content, h1 {
                background-color: #fff;
                border-bottom: 2px solid #e5e7eb;
                text-align: center;
                padding: 15px;
                margin: 5px;
            }
            h1 {
                padding: 15px;
                background-color: #e3e5ec;
                margin: 10px;
            }
            label {
                text-transform: uppercase;
                color: #5e5e5e;
                display: block;
                margin: 5px;
            }
            #className, #classDate, #classTime, #classLength, #trainerName {
                color: #3a60c7;
                font-size: 18px;
                margin-top: 5px;
            }
            #statusMessage {
                font-weight: bold;
            }
            button {
                text-decoration: none;
                border: none;
                font-weight: 600;
                padding: 8px 12px;
                margin: 10px;
                border-radius: 8px;
            }
            button:hover {
                background: #eef2ff;
                color: #263c7a;
            }
        </style>
    </head>

    <body>
        <table class="navigation">
            <tr>
                <td class="navBox"><a href="trainerDetails.html"><strong>FitSync</strong></a></td>
                <td class="navBox"><a href=""><strong>Logout</strong></a></td>
            </tr>
        </table>

        <div class="container">
            <h1>Class details</h1>
            <div class="content classDetails">
                    <label>Class name:</label>
                        <p id="className"></p>
                    <label>Date:</label>
                        <p id="classDate"></p>
                    <label>Time start:</label>
                        <p id="classTime"></p>
                    <label>Class length:</label>
                        <p id="classLength"></p>
                    <label>Assign trainer:</label>
                        <p id="trainerName"></p>
                </div>            
            </div>
        </div>

        <script type="module">
            import { db, auth } from './firebaseConfig.js'
            import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-auth.js";
            import { ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-database.js";

            // catch params passed from class view page 
            const id = new URLSearchParams(window.location.search).get('id');
            const classRef = ref(db, 'classes/' + id);

            // AUTHORISATION

            onAuthStateChanged(auth, async (user) => {
                if (!user) {
                    window.location.href = "index.html";
                    return;
                }
                
                // DISPLAY CLASS DETAILS FROM DATABASE

                // create real time listener
                onValue(classRef, (classSnapshot) => {

                    // get class data snapshot
                    const classData = classSnapshot.val();

                    // return function if no data
                    if (!classData) return;

                    // fill in class details from database
                    document.getElementById('className').textContent = classData.name;
                    document.getElementById('classDate').textContent = classData.date;
                    document.getElementById('classTime').textContent = classData.time.start;
                    if (classData.time.hours === 1) {
                        document.getElementById('classLength').textContent = classData.time.hours + ' hour';
                    } else {
                        document.getElementById('classLength').textContent = classData.time.hours + ' hours';
                    }
                    

                    // fetch trainer name 
                    const trainerId = classData.trainer_ID
                    const trainerRef = ref(db, `users/${trainerId}`);

                    // create real time listener for trainer data
                    onValue(trainerRef, (trainerSnapshot) => {

                        // get trainer snapshot
                        const trainerData = trainerSnapshot.val();

                        if (!trainerData) return;

                        document.getElementById('trainerName').textContent = trainerData.profile.firstName;
                    });
                });
            });
        </script>
    </body>
</html>
