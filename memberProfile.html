<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Billing profile</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
        <style>
            .content {
                background-color: #fff;
                border-bottom: 2px solid #e5e7eb;
                text-align: center;
                padding: 15px;
                margin: 5px;
            }
            h1 {
                background-color: #e3e5ec;
                border: none;
                text-align: center;
                padding: 15px;
                margin: 10px;
            }
            .sectionTitle {
                background-color: #e3e5ec;
                border: none;
                text-align: center;
                padding: 15px;
                margin: 10px 5px 5px;
            }
            #memberName, #membershipId, #memberEmail, #memberPhone, #memberAddress, #selectedPlanStatus {
                color: #3a60c7;
            }
            .planList {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
                align-items: start;
            }
            .plan {
                background-color: #fff;
                border-top: 3px solid #3a60c7;
                border-bottom: 2px solid #e5e7eb;
                text-align: center;
                padding: 15px;
                margin: 5px 0;
            }
            .planName, .planPrice {
                color: #3a60c7;
            }
            .planFeatures {
                padding-left: 20px;
                text-align: left;
                color: #374151;
            }
            .selectPlanButton, #continueToBilling, #cancelPlanButton {
                display: inline-block;
                text-decoration: none;
                border: none;
                color: #374151;
                font-weight: 600;
                font-size: 16px;
                padding: 8px 12px;
                margin-top: 10px;
                border-radius: 8px;
                background: transparent;
                cursor: pointer;
            }
            .selectPlanButton:hover, #continueToBilling:hover {
                background: #eef2ff;
                color: #263c7a;
            }
            #cancelPlanButton {
                color: #b91c1c;
            }
            #cancelPlanButton:hover {
                background: #fef2f2;
                color: #991b1b;
            }
            #profileMessage {
                font-weight: bold;
            }
        </style>
    </head>

    <body>
        <table class="navigation">
            <tr>
                <td class="navBox"><a href="memberDashboard.html"><strong>[Website name]</strong></a></td>
                <td class="navBox"><a href="gymTutorials.html"><strong>Tutorials</strong></a></td>
                <td class="navBox"><a href="memberClassView.html"><strong>Classes</strong></a></td>
                <td class="navBox"><a href="gymShop.html"><strong>Shop</strong></a></td>
                <td class="navBox"><a href="memberProfile.html"><strong>Membership</strong></a></td>
            </tr>
        </table>

        <div class="container">
            <h1>Billing profile</h1>
            <div class="content">
                <p id="memberName">Loading member name...</p>
                <p id="membershipId">Loading membership ID...</p>
                <p id="memberEmail">Loading email...</p>
                <p id="memberPhone">Loading phone...</p>
                <p id="memberAddress">Loading address...</p>
            </div>

            <h2 class="sectionTitle">Choose Your Membership Plan</h2>
            <div class="content">
                <p id="selectedPlanStatus">Choose a plan to continue to billing.</p>
                <div class="planList" id="planList"></div>
                <a id="continueToBilling" href="memberBillingSubscriptions.html">Continue to billing</a>
                <button type="button" id="cancelPlanButton" style="display: none;">Cancel Subscription</button>
                <p id="profileMessage"></p>
            </div>
        </div>

        <template id="planTemplate">
            <div class="plan">
                <h2 class="planName"></h2>
                <p class="planPrice"></p>
                <ul class="planFeatures"></ul>
                <button type="button" class="selectPlanButton">Select Plan</button>
            </div>
        </template>

        <script type="module">
            import { auth, db } from './firebaseConfig.js';
            import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-auth.js";
            import { ref, get, set, update } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-database.js";

            const defaultPlans = {
                basic: {
                    name: "BASIC PLAN",
                    price: 10,
                    billingCycle: "month",
                    features: ["Gym Access", "Locker Room"]
                },
                pro: {
                    name: "PRO PLAN",
                    price: 25,
                    billingCycle: "month",
                    features: ["Gym Access", "Locker Room", "Pool Access", "Sauna"]
                },
                elite: {
                    name: "ELITE PLAN",
                    price: 50,
                    billingCycle: "month",
                    features: ["Gym Access", "Locker Room", "Pool Access", "Sauna", "Trainer Support"]
                }
            };

            const memberName = document.getElementById("memberName");
            const membershipId = document.getElementById("membershipId");
            const memberEmail = document.getElementById("memberEmail");
            const memberPhone = document.getElementById("memberPhone");
            const memberAddress = document.getElementById("memberAddress");
            const selectedPlanStatus = document.getElementById("selectedPlanStatus");
            const continueToBilling = document.getElementById("continueToBilling");
            const cancelPlanButton = document.getElementById("cancelPlanButton");
            const profileMessage = document.getElementById("profileMessage");
            const planList = document.getElementById("planList");
            const planTemplate = document.getElementById("planTemplate");

            let currentUser = null;
            let currentSubscription = null;
            let plansCache = defaultPlans;

            continueToBilling.style.pointerEvents = "none";
            continueToBilling.style.opacity = "0.6";

            onAuthStateChanged(auth, async (user) => {
                if (!user) {
                    window.location.href = "index.html";
                    return;
                }

                currentUser = user;

                try {
                    const userRef = ref(db, "users/" + user.uid);
                    const plansRef = ref(db, "plans");

                    let [userSnapshot, plansSnapshot] = await Promise.all([
                        get(userRef),
                        get(plansRef)
                    ]);

                    if (!userSnapshot.exists()) {
                        const initialUserData = buildBaseUserData(user);
                        await set(userRef, initialUserData);
                        userSnapshot = await get(userRef);
                    }

                    if (!plansSnapshot.exists()) {
                        await set(plansRef, defaultPlans);
                        plansSnapshot = await get(plansRef);
                    }

                    const userData = userSnapshot.exists() ? userSnapshot.val() : buildBaseUserData(user);
                    const plans = plansSnapshot.exists() ? plansSnapshot.val() : defaultPlans;
                    plansCache = plans;

                    renderMemberDetails(user, userData);
                    currentSubscription = userData.subscription || null;
                    renderPlanStatus();
                    renderPlans(plans);
                } catch (error) {
                    profileMessage.textContent = "Unable to load billing profile: " + error.message;
                }
            });

            function renderMemberDetails(user, userData) {
                const profile = userData.profile || {};
                const fullName = profile.name || userData.name || "Member name not added";
                const memberId = userData.membershipId || user.uid;
                const phone = profile.phone || userData.phone || "Phone not added";
                const address = profile.address || userData.address || "Address not added";

                memberName.textContent = (userData.profile?.firstName || "Member");
                membershipId.textContent = "Membership ID: " + memberId;
                memberEmail.textContent = "Email: " + (userData.email || user.email || "No email found");
                memberPhone.textContent = "Phone: " + phone;
                memberAddress.textContent = "Address: " + address;
            }

            function buildBaseUserData(user) {
                return {
                    email: user.email || "",
                    role: "member",
                    membershipId: user.uid,
                    profile: {
                        name: "",
                        phone: "",
                        address: ""
                    }
                };
            }

            function renderPlanStatus() {
                if (!currentSubscription || !currentSubscription.planId) {
                    selectedPlanStatus.textContent = "Choose a plan to continue to billing.";
                    continueToBilling.style.pointerEvents = "none";
                    continueToBilling.style.opacity = "0.6";
                    cancelPlanButton.style.display = "none";
                    return;
                }

                const statusText = currentSubscription.status === "active"
                    ? "Active subscription: "
                    : "Selected plan: ";

                selectedPlanStatus.textContent = statusText + currentSubscription.planName + " ($" + currentSubscription.price + "/" + currentSubscription.billingCycle + ")";
                continueToBilling.style.pointerEvents = "auto";
                continueToBilling.style.opacity = "1";
                cancelPlanButton.style.display = "inline-block";
            }

            cancelPlanButton.addEventListener("click", async () => {
                if (!currentUser) return;

                const confirmCancel = confirm("Are you sure you want to cancel your subscription?");
                if (!confirmCancel) return;

                profileMessage.textContent = "Canceling subscription...";

                try {
                    await set(ref(db, "users/" + currentUser.uid + "/subscription"), null);
                    currentSubscription = null;
                    renderPlanStatus();
                    renderPlans(plansCache);
                    profileMessage.textContent = "Subscription cancelled successfully.";
                } catch (error) {
                    profileMessage.textContent = "Unable to cancel subscription: " + error.message;
                }
            });

            function renderPlans(plans) {
                planList.innerHTML = "";

                Object.entries(plans).forEach(([planId, planData]) => {
                    const templateCopy = planTemplate.content.cloneNode(true);
                    templateCopy.querySelector(".planName").textContent = planData.name;
                    templateCopy.querySelector(".planPrice").textContent = "$" + planData.price + " / " + (planData.billingCycle || "month");

                    const featuresList = templateCopy.querySelector(".planFeatures");
                    (planData.features || []).forEach((feature) => {
                        const item = document.createElement("li");
                        item.textContent = feature;
                        featuresList.appendChild(item);
                    });

                    const button = templateCopy.querySelector(".selectPlanButton");
                    const isSelected = currentSubscription && currentSubscription.planId === planId;
                    button.textContent = isSelected ? "Selected" : "Select Plan";

                    button.addEventListener("click", async () => {
                        await selectPlan(planId, planData);
                    });

                    planList.appendChild(templateCopy);
                });
            }

            async function selectPlan(planId, planData) {
                if (!currentUser) return;

                profileMessage.textContent = "Saving selected plan...";

                try {
                    const subscriptionData = {
                        planId: planId,
                        planName: planData.name,
                        price: planData.price,
                        billingCycle: planData.billingCycle || "month",
                        features: planData.features || [],
                        status: currentSubscription
                            && currentSubscription.status === "active"
                            && currentSubscription.planId === planId
                            ? "active"
                            : "pending_payment",
                        updatedAt: new Date().toISOString()
                    };

                    await update(ref(db, "users/" + currentUser.uid), {
                        email: currentUser.email || "",
                        role: "member",
                        membershipId: currentUser.uid
                    });

                    await update(ref(db, "users/" + currentUser.uid), {
                        subscription: subscriptionData
                    });

                    currentSubscription = subscriptionData;
                    renderPlanStatus();
                    renderPlans(plansCache);
                    profileMessage.textContent = "Plan saved. Continue to billing to complete subscription.";
                } catch (error) {
                    profileMessage.textContent = "Unable to save plan: " + error.message;
                }
            }
        </script>
    </body>
</html>
