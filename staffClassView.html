<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>View Classes</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
        <style>
           #classList {
                display: grid;
                grid-template-columns: repeat(3,1fr);
                gap: 10px;
                align-items: start;
            }
            .subContainer {
                text-align: center;
                padding: 20px;
            }
            .classView, h1 {
                background-color: #fff;
                border-top: 3px solid #3a60c7;
                border-bottom: 2px solid #e5e7eb;
                text-align: center;
                padding-bottom: 20px;
                margin: 5px;
            }
            h1 {
                padding: 15px;
                border: none;
                background-color: #e3e5ec;
                margin: 10px;
            }
            label {
                text-transform: uppercase;
                color: #5e5e5e;
                display: block;
                margin: 5px;
            }
            .classDate, .classTime {
                color: #3a60c7;
            }
            .classDetails, .createClass {
                text-decoration: none;
                color: #374151;
                font-weight: 600;
                font-size: 20px;
                padding: 8px 12px;
                border-radius: 8px;
            }
            .createClass {
                font-size: 26px;
                background-color: #e3e5ec;
            }
            .classDetails:hover, .createClass:hover {
                background: #eef2ff;
                color: #263c7a;
            }
        </style>
    </head>

    <body>
        <table class="navigation">
            <tr>
                <td class="navBox"><a href="StaffDashboard.html"><strong>[Website name]</strong></a></td>
                <td class="navBox"><a href="staffTrainerView.html"><strong>Trainers</strong></a></td>
                <td class="navBox"><a href="staffClassView.html"><strong>Classes</strong></a></td>
            </tr>
        </table>

        <div class="container">
            <h1>Classes</h1>
            <template id="classTemplate">
                <div class="classView">
                    <h2 class="className"></h2>
                    <p class="classDate"></p>
                    <p class="classTime"></p>
                    <a class="classDetails">Manage class</a>
                </div>
            </template>
            <div id="classList"></div>

            <div class="subContainer">
                <a class="createClass" href="staffCreateClass.html">Create new class</a>
            </div>

            </div>
        </div>

        <script type="module">
            import { db, auth } from './firebaseConfig.js'
            import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-auth.js";
            import { ref, onValue } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-database.js";

            // AUTHORISATION

            onAuthStateChanged(auth, async (user) => {
                if (!user) {
                    window.location.href = "index.html";
                    return;
                }
                    
                // DISPLAY ALL CLASSES IN A LIST

                // set variables
                const list = document.getElementById('classList');
                const template = document.getElementById('classTemplate');
                const classesRef = ref(db, 'classes')

                // create real time listener
                onValue(classesRef, (snapshot) => {
                    // clear list before re-render
                    list.innerHTML = ''; 

                    // get data snapshot
                    const data = snapshot.val();

                    // in case data is null, return
                    if (!data) {
                        list.innerHTML = "<p>No classes found</p>";
                        return;
                    }

                    // loop over each class
                    for (let key in data) {
                        const classData = data[key];

                        // make copy of template
                        const templateCopy = template.content.cloneNode(true);

                        // fill in template with class details
                        templateCopy.querySelector('.className').textContent = classData.name;
                        templateCopy.querySelector('.classDate').textContent = classData.date;
                        templateCopy.querySelector('.classTime').textContent = classData.time.start;
                        // pass class id as a parameter to next page
                        templateCopy.querySelector('.classDetails').href = `staffClassDetails.html?id=${key}`;

                        // add to list
                        list.appendChild(templateCopy);
                    }
                });
            });
        </script>
    </body>
</html>
