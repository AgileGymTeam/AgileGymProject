<!DOCTYPE html>
<html>

<head>
    <title>My Profile</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        .profileBox {
            background: white;
            max-width: 700px;
            margin: 50px auto;
            padding: 35px;
            text-align: center;
            border-top: 3px solid #3a60c7;
            border-bottom: 2px solid #e5e7eb;
        }

        .profilePic {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #eef2ff;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
        }

        .profileBox input {
            width: 90%;
            padding: 10px;
            margin: 8px 0 18px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
        }

        .profileBox label {
            display: block;
            font-weight: bold;
            color: #5e5e5e;
            text-transform: uppercase;
        }

        .profileLinks a,
        .profileBox button {
            display: inline-block;
            text-decoration: none;
            color: #374151;
            font-weight: 600;
            padding: 8px 12px;
            border-radius: 8px;
            border: none;
            background: #eef2ff;
            margin: 10px;
            cursor: pointer;
        }

        .profileLinks a:hover,
        .profileBox button:hover {
            color: #263c7a;
        }

        #profileMessage {
            color: #3a60c7;
        }

        #profileIcon {
            width: 220px;
            padding: 10px;
            margin: 8px 0 18px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container top">
        <h2>[Website name]</h2>
    </div>

    <div class="profileBox">
        <div class="profilePic" id="profilePic">👤</div>

        <h1>My Profile</h1>

        <label>Name</label>
        <input type="text" id="firstName">

        <label>Email</label>
        <input type="email" id="email" disabled>

        <label>Phone Number</label>
        <input type="text" id="phone">

        <label>Address</label>
        <input type="text" id="address">

        <select id="profileIcon">
            <option value="👤">👤 Default</option>
            <option value="🏋️">🏋️ Lifting M</option>
            <option value="🏋️‍♀️">🏋️‍♀️ Lifting F</option>
            <option value="🧘">🧘 Yoga M</option>
            <option value="🧘‍♀️">🧘‍♀️ Yoga F</option>
            <option value="🐦‍🔥">🐦‍🔥 Pheonix</option>
            <option value="⭐">⭐ Star</option>
            <option value="❤️">❤️ Heart</option>
            <option value="🍀">🍀 Clover</option>
        </select>

        <button id="saveProfileBtn">Save Profile</button>

        <div class="profileLinks">
            <a href="memberDashboard.html">Back to Dashboard</a>
            <a href="gymShop.html">My Orders</a>
        </div>

        <p id="profileMessage"></p>
    </div>

    <script type="module">
        import { auth, db } from './firebaseConfig.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-auth.js";
        import { ref, get, update } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-database.js";

        let currentUser = null;

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }

            currentUser = user;

            const userRef = ref(db, "users/" + user.uid);
            const snapshot = await get(userRef);

            if (snapshot.exists()) {
                const userData = snapshot.val();
                const profile = userData.profile || {};

                document.getElementById("firstName").value = profile.firstName || "";
                document.getElementById("email").value = userData.email || user.email || "";
                document.getElementById("phone").value = profile.phone || "";
                document.getElementById("address").value = profile.address || "";
                document.getElementById("profileIcon").value = profile.profileIcon || "👤";

                if (profile.profileIcon) {
                    document.getElementById("profilePic").textContent = profile.profileIcon;
                }
            }
        });

        document.getElementById("saveProfileBtn").addEventListener("click", async () => {
            const firstName = document.getElementById("firstName").value;
            const phone = document.getElementById("phone").value;
            const address = document.getElementById("address").value;
            const profileIcon = document.getElementById("profileIcon").value;

            await update(ref(db, "users/" + currentUser.uid + "/profile"), {
                firstName: firstName,
                phone: phone,
                address: address,
                profileIcon: profileIcon
            });

            document.getElementById("profilePic").textContent = profileIcon || "👤";
            document.getElementById("profileMessage").textContent = "Profile updated successfully.";
        });
    </script>

</body>

</html>
