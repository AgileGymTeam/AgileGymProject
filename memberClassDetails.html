<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Class details</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
        <style>
            .content, h1 {
                background-color: #fff;
                border-bottom: 2px solid #e5e7eb;
                text-align: center;
                padding: 15px;
                margin: 5px;
            }
            h1 {
                padding: 15px;
                background-color: #e3e5ec;
                margin: 10px;
            }
            label {
                text-transform: uppercase;
                color: #5e5e5e;
                display: block;
                margin: 5px;
            }
            #className, #classDate, #classTime, #classLength, #trainerName {
                color: #3a60c7;
                font-size: 18px;
                margin-top: 5px;
            }
            #statusMessage {
                font-weight: bold;
            }
            button {
                text-decoration: none;
                border: none;
                font-weight: 600;
                padding: 8px 12px;
                margin: 10px;
                border-radius: 8px;
            }
            button:hover {
                background: #eef2ff;
                color: #263c7a;
            }
        </style>
    </head>

    <body>
        <table class="navigation">
                <tr>
                    <td class="navBox"><a href=""><strong>[Website name]</strong></a></td>
                    <td class="navBox"><a href=""><strong>Tutorials</strong></a></td>
                    <td class="navBox"><a href="memberClassView.html"><strong>Classes</strong></a></td>
                    <td class="navBox"><a href=""><strong>Shop</strong></a></td>
                    <td class="navBox"><a href=""><strong>Profile</strong></a></td>
                    <td class="navBox"><a href=""><strong>Logout</strong></a></td>
                </tr>
        </table>

        <div class="container">
            <h1>Class details</h1>
            <div class="content classDetails">
                    <label>Class name:</label>
                        <p id="className"></p>
                    <label>Date:</label>
                        <p id="classDate"></p>
                    <label>Time start:</label>
                        <p id="classTime"></p>
                    <label>Class length:</label>
                        <p id="classLength"></p>
                    <label>Assign trainer:</label>
                        <p id="trainerName"></p>

                <p id="statusMessage"></p>
                <form id="signup">
                    <button type="button" id="signupButton"></button>
                </form>
                </div>            
            </div>
        </div>

        <script type="module">
            import { db } from './firebaseConfig.js'
            import { ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-database.js";

            // catch params passed from class view page 
            const id = new URLSearchParams(window.location.search).get('id');
            const classRef = ref(db, 'classes/' + id);

            // DISPLAY CLASS DETAILS FROM DATABASE

            // create real time listener
            onValue(classRef, (classSnapshot) => {

                // get class data snapshot
                const classData = classSnapshot.val();

                // return function if no data
                if (!classData) return;

                // fill in class details from database
                document.getElementById('className').textContent = classData.name;
                document.getElementById('classDate').textContent = classData.date;
                document.getElementById('classTime').textContent = classData.time.start;
                if (classData.time.hours === 1) {
                    document.getElementById('classLength').textContent = classData.time.hours + ' hour';
                } else {
                    document.getElementById('classLength').textContent = classData.time.hours + ' hours';
                }
                

                // fetch trainer name 
                const trainerId = classData.trainer_ID
                const trainerRef = ref(db, `trainers/${trainerId}`);

                // create real time listener for trainer data
                onValue(trainerRef, (trainerSnapshot) => {

                    // get trainer snapshot
                    const trainerData = trainerSnapshot.val();

                    if (!trainerData) return;

                    document.getElementById('trainerName').textContent = trainerData.name;
                });
            });

            // TOGGLE SIGN UP STATE
            let signedUp = false;
            const btn = document.getElementById('signupButton');
            const message = document.getElementById('statusMessage');

            // set userId 
            const userId = 1; // SET TEMP VALUE UNTIL LOGIN AND USER AUTH IS DONE
            const userClassRef = ref(db, `users/${userId}/classes/${id}`);

            // create listener for users classes
            onValue(userClassRef, (userClassSnapshot) => {

                // if class is in users list = true, else false
                signedUp = userClassSnapshot.exists();
                
                // change button text
                btn.textContent = signedUp
                    ? 'Cancel Sign Up'
                    : 'Sign Up';

                // change message
                message.textContent = signedUp
                    ? 'You are signed up for this class!'
                    : '';

            });

            // SIGN UP FUNCTIONALITY
            btn.addEventListener('click', (e) => {
                e.preventDefault();

                if (signedUp) {
                    // remove class from users list
                    remove(userClassRef);
                } else {
                    // add class to users list
                    set(userClassRef, true);
                }
            });

        </script>
    </body>
</html>
